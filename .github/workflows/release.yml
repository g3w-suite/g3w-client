name: Publish release assets
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup config.js
        run: |
          cp config.template.js config.js
          sed -i "s|\.\./g3w-admin/g3w-admin|./build|g" config.js
          sed -i "s|\.\./g3w-suite-docker/config/g3w-suite/overrides|./build/client|g" config.js
          sed -i "s|\.\./g3w-suite-docker/shared-volume/plugins||g" config.js

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build:ci

      - name: Create Zip Archive
        run: |
          cd build
          zip -r ../g3w-client.zip .

      - name: Upload Zip to GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: g3w-client.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}